apiVersion: sourceplane.io/v1
kind: Component
metadata:
  name: web
  description: The image uploader (Next.js on Cloudflare Workers + Static Assets via @opennextjs/cloudflare, per environment)
spec:
  type: cloudflare-workers-assets-turbo
  lifecycle: production
  owner: platform
  domain: web
  path: apps/web
  # Its own lane per environment: the Next.js build is the longest job in the
  # plan, and a shared lane would wait on it.
  lane: isolated
  # INFRA BEFORE APP. The Worker binds the R2 bucket by name, and the name is
  # rendered into its config during the build from the wiring document the
  # cloudflare-r2 root lease-publishes after its apply. A job resolves its
  # secrets when it STARTS, so on a merge to main this deploy waits for that
  # environment's apply (enforced) and the document is there; a pull request
  # deploys nothing, so nothing on one waits (advisory).
  dependsOn:
    - component: cloudflare-r2
      mode: enforced
      modeRules:
        - mode: advisory
          when:
            triggerRef: github-pull-request
  secretEnv:
    WIRING_CLOUDFLARE_R2_STAGE: "secret://blob-starter/blob-starter/stage/WIRING_CLOUDFLARE_R2"
    WIRING_CLOUDFLARE_R2_PROD: "secret://blob-starter/blob-starter/prod/WIRING_CLOUDFLARE_R2"
  subscribe:
    environments:
      - name: dev
        profile: verify
      - name: stage
        profile: verify
        profileRules:
          - profile: deploy
            when:
              triggerRef: github-push-main
      - name: prod
        profile: verify
        profileRules:
          - profile: deploy
            when:
              triggerRef: github-push-main
  parameters:
    nodeVersion: "22"
    pnpmVersion: "10.12.1"

    workspaceDir: ../..
    appDir: .

    turboFilter: "@app/web"
    wranglerConfig: wrangler.jsonc

    # @opennextjs/cloudflare emits a Worker entrypoint plus a static-assets
    # directory bound via ASSETS — both deploy in one `wrangler deploy`.
    workerEntrypoint: .open-next/worker.js
    assetsDir: .open-next/assets

    # Per-env worker name: blob-starter-web-{dev,stage,prod}.
    workerName: blob-starter-web
    environmentAwareWorkerName: true

    # The account's workers.dev subdomain; exported to the smoke step as
    # ${WORKERS_DEV_SUBDOMAIN} and used to build ${DEPLOYED_URL}.
    workersDevSubdomain: your-workers-subdomain

    installCommand: pnpm install --frozen-lockfile
    # Render this environment's wrangler config, then build. stage and prod
    # render from the wiring document their cloudflare-r2 apply published
    # (secretEnv above, resolved before the job's first step); dev, which no
    # root applies to and which only verifies, renders from the committed
    # fixture. The committed wrangler.jsonc (the fixture render) is what the
    # composition's verify-app-structure step finds before this runs.
    buildCommand: node ../../tooling/wire/live.mjs --template wrangler.template.jsonc --out wrangler.jsonc --components cloudflare-r2 --env "${ORUN_ENVIRONMENT}" --fixture wiring.fixture.json --fixture-envs dev && pnpm exec turbo run build --filter=@app/web

    # Smoke, read-only: the delivery route asked for an object nobody stored —
    # a new key on every attempt — must answer the route's own `Not found`
    # 404, which only the Worker can, and only by reading the BLOB bucket (an
    # unbound or unreachable bucket is a 500). Then the page renders its
    # uploader. Not the site's name: that is the owner's to change, and
    # HTML-escaped when it carries an `&` or `'`. Nothing is uploaded, so a
    # deploy leaves the bucket as it found it. Responses are buffered before
    # grep so an early match cannot SIGPIPE curl.
    smokeCommand: "out=$(curl -s -w ' %{http_code}' \"${DEPLOYED_URL}/api/blob?pathname=smoke/$(date +%s)-${RANDOM}.png\") && [ \"${out}\" = 'Not found 404' ] && html=$(curl -sfL \"${DEPLOYED_URL}/\") && echo \"${html}\" | grep -q 'Upload an image'"
  labels:
    team: platform
    layer: delivery
    surface: web
    runtime: cloudflare
