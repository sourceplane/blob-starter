# The epic's declaration. metadata.name equals the directory name; metadata.key
# is the task-key prefix this epic reserves (BL → BL-1, BL-2, …). Owner, target
# date and health are the platform's — never written here.
apiVersion: orun.io/v1
kind: Epic
metadata:
  name: blob-starter
  key: BL
spec:
  title: "Vercel's Blob Next.js Starter on Cloudflare Workers with R2"
  summary: "The Vercel Blob Next.js Starter — an image uploader with drag-and-drop, a preview, a progress bar, image-only and 50MB checks, and a private delivery route — runs on Cloudflare Workers + Static Assets through @opennextjs/cloudflare with the files in a Cloudflare R2 bucket provisioned by Terraform through Orun, inside the Cirrus baseline's repository conventions. Vercel Blob's client-token upload becomes an upload route in front of the bucket, with the same checks and the same result shape, so the uploader component stays as written."
  state: completed
  milestones:
    - name: "BL0 — the spec"
      exitCriteria:
        - "the doc set and the task contracts are on main"
      tasks: [BL-1]
    - name: "BL1 — uploads on R2"
      exitCriteria:
        - "apps/web is the upstream template with uploads and delivery going through the BLOB R2 binding"
        - "the wrangler config renders per environment from the cloudflare-r2 root's wiring document (fixture in verify, live in deploy)"
        - "`pnpm typecheck`, `pnpm lint`, `pnpm test` and `pnpm build` are green on main (Checks)"
        - "`wrangler dev` serves the page, accepts an image on PUT /api/upload and streams it back from GET /api/blob"
      tasks: [BL-2]
    - name: "BL2 — the R2 bucket from Terraform"
      exitCriteria:
        - "infra/terraform/cloudflare-r2 provisions the stage and prod buckets and publishes the wiring document the app renders from"
      tasks: [BL-3]
    - name: "BL3 — ready to instantiate"
      exitCriteria:
        - "the README says how to run, test, preview and deploy it, and where the authentication hooks are"
        - "the as-built status records every departure from the upstream template"
      tasks: [BL-4]
    - name: "BL4 — a baseline, in one landing"
      exitCriteria:
        - "blueprint.yaml (the console card) and repo-blueprint.yaml (the build) take a new product from nothing to live on stage and prod in ONE landing (01-product) and a hook-only record (02-docs)"
        - "the product's own push-to-main plan applies cloudflare-r2 before it deploys web, and the landing's await finds WIRING_CLOUDFLARE_R2 on stage and prod"
        - "the R2 root applies with an r2-data token (CLOUDFLARE_R2_TOKEN) the card previews; the Worker deploys with workers-deploy and reaches its bucket through its binding, so uploads need no other key"
        - "a product built from it carries the product only, renamed throughout to its own name, repository, Worker and bucket names"
        - "Baseline CI is green: contract tests, the blueprint read by the pinned orun, the leak gate, the offline bootstrap and the end-to-end tier"
      tasks: [BL-5]
    - name: "BL5 — the cirrus standard, SVG uploads closed"
      exitCriteria:
        - "uploads are raster images only (PNG, JPEG, GIF, WebP, AVIF) — an SVG is refused — and the delivery route serves every object under a CSP that sandboxes it, so nothing stored can run script on the app's origin"
        - "nothing outside this milestone's own record names kiox: orun is pinned where CI runs it (the orun-action `version:` in each workflow)"
        - "every component carries generated docs/{overview,architecture,runbook}.md, and Baseline CI fails a pull request whose manifests and pages disagree"
        - "ai/context carries this repository's current.md, decisions.md and open-risks.md, and none of them ships to a product"
        - "every milestone's status row agrees with the tags"
        - "the console card reads subdomain from the Cloudflare connection (from: connection.cloudflare.workersSubdomain), as cirrus-baseline since baseline-v23"
      tasks: [BL-6, BL-7]
